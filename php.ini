[mail function]
sendmail_path = /usr/bin/msmtp -t -i

session.cookie_domain = craftypic.ilandols.com
session.cookie_path = /
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.use_only_cookies = 1
session.name = CAMAGRU_TROP_COOL
session.cookie_lifetime = 3600
session.gc_maxlifetime = 3600
session.gc_probability = 1
session.gc_divisor = 100

; Durcissement : coupe le chemin "session upload progress", vecteur confirmé de
; CVE-2026-109619. Défense en profondeur ; le correctif réel est PHP 8.3 (Dockerfile).
session.upload_progress.enabled = 0

expose_php = 0

display_errors = Off
; display_startup_errors = On
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL


upload_max_filesize = 5M
post_max_size = 5M